<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>品牌销售 TOP10 与原因分析</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">Taobao MCP · sales top 10 readout</p>
        <h1>品牌销售 TOP10 与原因分析</h1>
        <p>按品牌逐一查看可见销量/付款字段靠前商品，并解释联名、明星同款、基础款、材质、功能和价格带等可能驱动。</p>
      </div>
      <div class="source-note">
        <span id="generatedAt">—</span>
        <strong id="brandCount">—</strong>
        <small>品牌</small>
      </div>
    </header>

    <main>
      <section class="controls">
        <label>品牌<select id="brandFilter"></select></label>
        <p>说明：销量/付款字段来自前台可见文本，不等同品牌后台 GMV；字段缺失的品牌会标注为参考排序。</p>
      </section>
      <section class="summary-grid" id="summaryGrid"></section>
      <nav class="brand-nav" id="brandNav"></nav>
      <section class="brand-list" id="brandList"></section>
    </main>

    <script src="./assets/data.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
