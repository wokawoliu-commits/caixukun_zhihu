<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23bf3d45'/%3E%3Cpath d='M18 18h28v6H18zm0 11h28v6H18zm0 11h18v6H18z' fill='white'/%3E%3C/svg%3E">
  <title>小红书本地知识库</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f7f4;
      --panel: #ffffff;
      --ink: #1d2524;
      --muted: #64706c;
      --line: #dfe4df;
      --accent: #bf3d45;
      --accent-2: #0f766e;
      --gold: #94630b;
      --shadow: 0 12px 30px rgba(31, 41, 36, 0.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      letter-spacing: 0;
    }
    button, input { font: inherit; }
    .shell { min-height: 100vh; display: grid; grid-template-columns: 280px minmax(0, 1fr); }
    aside {
      border-right: 1px solid var(--line);
      background: #fbfbf8;
      padding: 24px 18px;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: auto;
    }
    main { min-width: 0; padding: 28px; }
    .brand { display: grid; gap: 6px; margin-bottom: 20px; }
    .brand h1 { margin: 0; font-size: 22px; line-height: 1.2; }
    .brand p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.5; }
    .stats-bar { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin: 18px 0; }
    .stat { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 10px; }
    .stat strong { display: block; font-size: 20px; }
    .stat span { color: var(--muted); font-size: 12px; }
    .search { position: relative; margin: 14px 0 18px; }
    .search input {
      width: 100%;
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      padding: 0 12px;
      outline: none;
    }
    .search input:focus { border-color: var(--accent-2); box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.12); }
    .section-title { margin: 18px 0 8px; color: var(--muted); font-size: 12px; font-weight: 700; text-transform: uppercase; }
    .tag-list { display: flex; flex-wrap: wrap; gap: 8px; }
    .tag {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--ink);
      min-height: 32px;
      border-radius: 999px;
      padding: 6px 10px;
      cursor: pointer;
    }
    .tag.active { border-color: var(--accent); color: var(--accent); background: #fff4f4; }
    .toolbar { display: flex; align-items: end; justify-content: space-between; gap: 14px; margin-bottom: 18px; }
    .toolbar h2 { margin: 0; font-size: 24px; line-height: 1.2; }
    .toolbar p { margin: 5px 0 0; color: var(--muted); font-size: 14px; }
    .clear {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      min-height: 38px;
      padding: 0 12px;
      cursor: pointer;
    }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: var(--shadow);
      display: grid;
      grid-template-rows: auto 1fr;
      min-height: 390px;
    }
    .thumb {
      aspect-ratio: 4 / 3;
      background: linear-gradient(135deg, #e5ece7, #f5ecec);
      overflow: hidden;
      position: relative;
    }
    .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .empty-thumb { width: 100%; height: 100%; display: grid; place-items: center; color: var(--muted); font-size: 14px; }
    .badge {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(29, 37, 36, 0.82);
      color: #fff;
      border-radius: 999px;
      padding: 4px 8px;
      font-size: 12px;
    }
    .card-body { padding: 14px; display: grid; gap: 10px; align-content: start; }
    .card h3 { margin: 0; font-size: 17px; line-height: 1.35; }
    .desc { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.55; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .meta { color: var(--muted); font-size: 12px; display: flex; gap: 8px; flex-wrap: wrap; }
    .mini-tags { display: flex; gap: 6px; flex-wrap: wrap; }
    .mini-tags span { background: #eef6f4; color: #0f5f59; border-radius: 999px; padding: 4px 7px; font-size: 12px; }
    .card-actions { display: flex; gap: 8px; margin-top: 2px; }
    .primary, .secondary {
      border-radius: 8px;
      min-height: 36px;
      padding: 0 11px;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }
    .primary { border: 1px solid var(--accent); background: var(--accent); color: #fff; }
    .secondary { border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
    dialog {
      width: min(980px, calc(100vw - 28px));
      max-height: calc(100vh - 28px);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.22);
    }
    dialog::backdrop { background: rgba(29, 37, 36, 0.36); }
    .detail { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(280px, 0.9fr); max-height: calc(100vh - 28px); }
    .media-pane { background: #111; min-height: 420px; overflow: auto; }
    .media-pane img, .media-pane video { display: block; width: 100%; max-height: 78vh; object-fit: contain; background: #111; }
    .copy-pane { padding: 20px; overflow: auto; }
    .copy-head { display: flex; align-items: start; justify-content: space-between; gap: 14px; }
    .copy-head h3 { margin: 0; font-size: 22px; line-height: 1.25; }
    .close { border: 1px solid var(--line); background: var(--panel); width: 36px; height: 36px; border-radius: 8px; cursor: pointer; }
    .full-desc { white-space: pre-wrap; color: #293231; line-height: 1.7; }
    .empty { border: 1px dashed var(--line); border-radius: 8px; padding: 32px; background: var(--panel); color: var(--muted); }
    @media (max-width: 820px) {
      .shell { grid-template-columns: 1fr; }
      aside { position: static; height: auto; }
      main { padding: 18px; }
      .toolbar { align-items: start; flex-direction: column; }
      .detail { grid-template-columns: 1fr; }
      .media-pane { min-height: 260px; }
    }
  </style>

  <script>
    const data = JSON.parse(document.getElementById('kb-data').textContent);
    const state = { query: '', tag: '' };
    const els = {
      itemCount: document.getElementById('itemCount'),
      tagCount: document.getElementById('tagCount'),
      searchInput: document.getElementById('searchInput'),
      tagList: document.getElementById('tagList'),
      grid: document.getElementById('grid'),
      viewTitle: document.getElementById('viewTitle'),
      viewSubtitle: document.getElementById('viewSubtitle'),
      clearButton: document.getElementById('clearButton'),
      dialog: document.getElementById('detailDialog')
    };

    function escapeHtml(value) {
      return String(value || '').replace(/[&<>"']/g, c => ({'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'}[c]));
    }
    function typeLabel(value) {
      if (value === 'video') return '视频';
      if (value === 'normal' || value === 'image') return '图文';
      return value || '未知';
    }
    function bestThumb(item) {
      if (item.poster && item.poster.url) return item.poster.url;
      const image = (item.images || []).find(x => x.url);
      return image ? image.url : '';
    }
    function tagsWithCounts() {
      const counts = new Map();
      for (const item of data.items) for (const tag of item.tags || []) counts.set(tag, (counts.get(tag) || 0) + 1);
      return [...counts.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], 'zh-Hans-CN'));
    }
    function filteredItems() {
      const query = state.query.trim().toLowerCase();
      return data.items.filter(item => {
        const inTag = !state.tag || (item.tags || []).includes(state.tag);
        if (!inTag) return false;
        if (!query) return true;
        const haystack = [item.title, item.desc, item.author && item.author.nickname, ...(item.tags || [])].join(' ').toLowerCase();
        return haystack.includes(query);
      });
    }
    function renderTags() {
      const tags = tagsWithCounts();
      els.tagCount.textContent = tags.length;
      els.tagList.innerHTML = tags.map(([tag, count]) => (
        `<button class="tag ${state.tag === tag ? 'active' : ''}" type="button" data-tag="${escapeHtml(tag)}">${escapeHtml(tag)} ${count}</button>`
      )).join('');
      els.tagList.querySelectorAll('button').forEach(button => {
        button.addEventListener('click', () => {
          state.tag = button.dataset.tag === state.tag ? '' : button.dataset.tag;
          render();
        });
      });
    }
    function renderCards() {
      const items = filteredItems();
      els.itemCount.textContent = data.items.length;
      els.viewTitle.textContent = state.tag ? `标签：${state.tag}` : '全部收藏';
      els.viewSubtitle.textContent = `${items.length} / ${data.items.length} 条内容`;
      if (!items.length) {
        els.grid.innerHTML = '<div class="empty">没有匹配的内容。可以清除筛选，或先运行导入命令添加小红书链接。</div>';
        return;
      }
      els.grid.innerHTML = items.map(item => {
        const thumb = bestThumb(item);
        const tags = (item.tags || []).slice(0, 5).map(tag => `<span>${escapeHtml(tag)}</span>`).join('');
        return `<article class="card">
          <div class="thumb">${thumb ? `<img src="${escapeHtml(thumb)}" alt="">` : '<div class="empty-thumb">暂无本地封面</div>'}<span class="badge">${escapeHtml(typeLabel(item.type))}</span></div>
          <div class="card-body">
            <h3>${escapeHtml(item.title)}</h3>
            <p class="desc">${escapeHtml(item.desc)}</p>
            <div class="meta"><span>${escapeHtml(item.author && item.author.nickname)}</span><span>赞 ${escapeHtml(item.stats && item.stats.liked_count)}</span><span>藏 ${escapeHtml(item.stats && item.stats.collected_count)}</span></div>
            <div class="mini-tags">${tags}</div>
            <div class="card-actions"><button class="primary" type="button" data-id="${escapeHtml(item.id)}">查看</button><a class="secondary" href="${escapeHtml(item.source_url)}" target="_blank" rel="noreferrer">原文</a></div>
          </div>
        </article>`;
      }).join('');
      els.grid.querySelectorAll('button[data-id]').forEach(button => {
        button.addEventListener('click', () => showDetail(button.dataset.id));
      });
    }
    function showDetail(id) {
      const item = data.items.find(entry => entry.id === id);
      if (!item) return;
      const videos = (item.videos || []).filter(video => video.url);
      const images = (item.images || []).filter(image => image.url);
      const mediaHtml = videos.length
        ? videos.map(video => `<video controls poster="${escapeHtml(item.poster && item.poster.url)}" src="${escapeHtml(video.url)}"></video>`).join('')
        : images.map(image => `<img src="${escapeHtml(image.url)}" alt="">`).join('') || '<div class="empty-thumb">暂无本地媒体</div>';
      const tags = (item.tags || []).map(tag => `<span>${escapeHtml(tag)}</span>`).join('');
      els.dialog.innerHTML = `<div class="detail">
        <div class="media-pane">${mediaHtml}</div>
        <div class="copy-pane">
          <div class="copy-head"><h3>${escapeHtml(item.title)}</h3><button class="close" type="button" aria-label="关闭">×</button></div>
          <div class="meta"><span>${escapeHtml(typeLabel(item.type))}</span><span>${escapeHtml(item.author && item.author.nickname)}</span><span>${escapeHtml(item.ingested_at)}</span></div>
          <div class="mini-tags">${tags}</div>
          <p class="full-desc">${escapeHtml(item.desc)}</p>
          <div class="card-actions"><a class="primary" href="${escapeHtml(item.note_md_url)}">Markdown</a><a class="secondary" href="${escapeHtml(item.source_url)}" target="_blank" rel="noreferrer">打开原文</a></div>
        </div>
      </div>`;
      els.dialog.querySelector('.close').addEventListener('click', () => els.dialog.close());
      els.dialog.showModal();
    }
    function render() {
      renderTags();
      renderCards();
    }
    els.searchInput.addEventListener('input', event => {
      state.query = event.target.value;
      renderCards();
    });
    els.clearButton.addEventListener('click', () => {
      state.query = '';
      state.tag = '';
      els.searchInput.value = '';
      render();
    });
    render();
  </script>
</body>
</html>
