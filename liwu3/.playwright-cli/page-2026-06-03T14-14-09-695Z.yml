    - paragraph [ref=e19]:
      - text: 在这四个品牌中，礼赠并不是一个边缘品类，而是一种战略视角：每个品牌都借此把自己的核心身份转化为产品、传播和零售体验。The Beast / 野兽派把礼赠视为围绕鲜花、收藏型联名和高度适合分享的节庆瞬间所构建的场景化情感剧场。Aesop 将礼赠转化为一种有文化感、低压力的品鉴与判断；所谓“礼物”不仅是产品本身，也包括周到的策选和优雅的服务。Fortnum & Mason 把礼赠定义为规模化的愉悦待客之道，凭借礼篮、个性化和礼宾支持，成为四者中运营成熟度最高的品牌。相比之下，Maison Margiela Replica 用礼赠来解决香水品类的经典难题——不确定性——通过探索套装、试香机制、以记忆为核心的叙事，以及让无形产品更容易选择和分享的零售/活动体验来完成转化。
      - superscript [ref=e20]: 引用
    - paragraph [ref=e21]:
      - text: 最大的战略分野在于
      - strong [ref=e22]: 场景剧场化
      - text: 与
      - strong [ref=e23]: 决策减负
      - text: 。野兽派和 Fortnum & Mason 在既有日历节点存在时最强，例如 520、母亲节、七夕、圣诞节、情人节、加冕礼、父亲节；它们通过让节日更盛大、更仪式化、更上镜来获胜。Aesop 和 Replica 则更擅长处理消费者仍然需要判断“送什么才安全、才合适”的品类。Aesop 通过精选套装、顾问、企业工作坊和精心准备的包装来完成这一点；Replica 则依靠探索套装、明确的试香计划、旅行装以及以折扣推动转化为正装的机制来降低决策压力。
      - superscript [ref=e24]: 引用
    - paragraph [ref=e25]:
      - text: 从产品适配度看，Fortnum & Mason 和野兽派拥有最宽的价格阶梯，也最容易形成显性的“英雄”礼赠单品；而 Aesop 和 Replica 更擅长
      - strong [ref=e26]: 风险可控的礼赠
      - text: 。野兽派的价格带从相对易入手的角色联名家居/香氛礼品，延伸到更高客单价的花束和带叙事的定制花束，并支持指定日期配送。Fortnum & Mason 从低价可食用小礼物延展到定制礼篮和个性化香槟，同时还具备礼篮复用和“自选礼篮”功能。Aesop 与 Replica 都擅长模块化礼赠架构：探索套装、旅行装、双件套、精选组合、样品以及礼赠服务，共同降低护肤与香水品类的送礼压力。
      - superscript [ref=e27]: 引用
    - paragraph [ref=e28]:
      - text: 在公开披露层面，信息通常是间接的，而非基于 ROI 的。最清晰的、与礼赠相关的量化披露包括：Aesop 2021 年公益活动结构，即 Aesop Foundation 无论销量如何都向五个组织各捐赠 AUD$100,000；野兽派当前抖音旗舰店规模为 88.1 万粉丝和 728 万点赞；*The Times* 报道的 Fortnum & Mason 更广义礼篮业务指标，包括每年售出数十万个礼篮、发往 100 多个国家，以及皮卡迪利旗舰店在前一个 12 月迎来 80 万访客；以及 Replica 的探索套装/产品需求指标，包括 Memory Box 套装在 6,526 条评价中获得 4.4/5 分，以及 Afternoon Delight 获得 2025 年 Fragrance Foundation 奖项。除此之外，本次审阅材料中大多数公开活动层面的销售提升并未披露。
      - superscript [ref=e29]: 引用
