<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>知乎知识类 UP 主推荐汇总</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23087f72'/%3E%3Cpath d='M17 20h30v7H34v17h-8V27h-9z' fill='white'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">Zhihu Knowledge Creator Report</p>
        <h1>知乎知识类 UP 主推荐汇总</h1>
      </div>
      <nav class="actions" aria-label="文件操作">
        <a class="action-link" href="assets/knowledge-up-summary.csv">UP 汇总 CSV</a>
        <a class="action-link" href="assets/knowledge-up-mentions-clean.csv">明细 CSV</a>
        <a class="action-link" href="assets/knowledge-up-mentions-partial.xlsx">工作簿</a>
      </nav>
    </header>

    <main class="shell">
      <section class="notice" id="notice"></section>

      <section class="metrics" id="metrics" aria-label="采集指标"></section>

      <section class="controls" aria-label="筛选条件">
        <label class="search-box">
          <span>搜索</span>
          <input id="searchInput" type="search" placeholder="UP 主、领域、点评关键词" autocomplete="off" />
        </label>
        <label>
          <span>排序</span>
          <select id="sortSelect">
            <option value="weight">总权重</option>
            <option value="mentions">提及次数</option>
            <option value="comments">评论提及</option>
            <option value="positive">正向提及</option>
            <option value="name">名称</option>
          </select>
        </label>
        <label>
          <span>来源</span>
          <select id="sourceSelect">
            <option value="all">全部来源</option>
            <option value="回答">回答</option>
            <option value="回答下评论">回答下评论</option>
          </select>
        </label>
        <label>
          <span>倾向</span>
          <select id="sentimentSelect">
            <option value="all">全部倾向</option>
            <option value="正向/推荐">正向/推荐</option>
            <option value="负向/避雷">负向/避雷</option>
            <option value="中性/提及">中性/提及</option>
          </select>
        </label>
      </section>

      <section class="domain-strip" id="domainStrip" aria-label="知识领域筛选"></section>

      <section class="workspace">
        <aside class="side-panel">
          <div class="panel-heading">
            <div>
              <h2>领域分布</h2>
              <p id="domainHint"></p>
            </div>
          </div>
          <div class="domain-bars" id="domainBars"></div>
        </aside>

        <section class="ranking-panel">
          <div class="panel-heading">
            <div>
              <h2>UP 主列表</h2>
              <p id="resultCount"></p>
            </div>
            <button id="resetButton" type="button">重置筛选</button>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>UP 主</th>
                  <th>领域</th>
                  <th>总权重</th>
                  <th>提及</th>
                  <th>评论</th>
                </tr>
              </thead>
              <tbody id="summaryBody"></tbody>
            </table>
          </div>
        </section>

        <section class="detail-panel" id="detailPanel" aria-live="polite"></section>
      </section>
    </main>

    <script src="assets/data.js"></script>
    <script src="assets/app.js"></script>
  </body>
</html>
